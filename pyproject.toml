[project]
name = "crewclaw"
version = "0.1.0"
description = "Local-first autonomous agent system with CrewAI and SQLite-vec"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.14.0",
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=3.0.0",
    "litellm[proxy]>=1.40.0",
    "watchdog>=4.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "ddgs>=9.10.0",
    "readability-lxml>=0.8.4.1",
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.14.0",
]

[project.scripts]
crewclaw = "crewclaw.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crewclaw*"]

[tool.setuptools.package-dir]
crewclaw = "crewclaw"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python-version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.vulture]
min_confidence = 80
paths = ["crewclaw"]
exclude = [".venv", "tests"]
ignore_names = [
    "send_message", "listen", "TelegramChannel",
    "create_agent", "list_agents", "get_agent",
    "max_execution_time", "max_retry_limit",
    "row_factory", "min_importance", "max_memories_per_session",
    "after_task", "register", "unregister", "run_hooks",
    "delete", "modified_time", "list_memories",
    "evolution_log", "_embedding_dim", "get_by_hash",
    "hooks", "_stop_event",
    "ALL_TOOLS_LIST", "create_router_agent",
    "end_char", "args_schema", "_run",
]

[tool.pyright]
extraPaths = ["."]
ignore = ["tests"]
